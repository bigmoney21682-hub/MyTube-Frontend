build:
  runs-on: ubuntu-latest
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm install  # Changed back to npm install to avoid lock file requirement

    - name: Build
      run: npm run build
      env:
        CI: false

    - name: Copy index.html to 404.html (Fix routing)
      run: cp dist/index.html dist/404.html

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: dist/
